name: Update IPTV Lists and EPG

on:
  workflow_dispatch:
  schedule:
    # 北京时间每两小时更新 M3U；其中 00:00 / 12:00 同时更新 EPG。
    - cron: "0 0,12 * * *"
      timezone: "Asia/Shanghai"
    - cron: "0 2,4,6,8,10,14,16,18,20,22 * * *"
      timezone: "Asia/Shanghai"
  push:
    branches: [main]
    paths:
      - "rtp/**"
      - "epg/**"
      - "config/**"
      - "docs/README.template.md"
      - ".github/workflows/update-rtp.yml"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: update-iptv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  epg:
    # 按计划时段判断，避免 GitHub 延迟启动改变 EPG 更新频率；手动和推送仍更新。
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 0,12 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Show Beijing execution time
        run: date '+Beijing time %Y-%m-%d %H:%M:%S %Z (%z)'
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Update and validate EPG
        run: |
          python -u epg/update.py
          python epg/update.py --check
      - name: Sync cached playlist EPG URL
        id: cached_lists
        if: ${{ hashFiles('data/sources.json') != '' }}
        continue-on-error: true
        run: |
          python rtp/b.py --offline
      - name: Upload EPG
        uses: actions/upload-artifact@v4
        with:
          name: iptv-epg
          path: epg.xml.gz
          if-no-files-found: error
      - name: Commit EPG
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          CACHED_LISTS_OUTCOME: ${{ steps.cached_lists.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- epg.xml.gz
          if [ "$CACHED_LISTS_OUTCOME" = "success" ]; then
            git add -- m3u manifest.json data/sources.json README.md
            # 文件头已切到 gzip 地址后，才清理旧版明文产物。
            git rm --ignore-unmatch -- epg.xml
          fi
          if git diff --cached --quiet; then
            echo "No EPG changes."
          else
            git commit -m "chore: update merged EPG and cached playlist metadata"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
  update:
    # EPG 未到时段而跳过或执行失败时，仍继续采集 M3U。
    needs: epg
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install source dependency
        run: python -m pip install requests==2.34.2
      - name: Update and validate
        run: |
          python -u rtp/b.py --fresh
      - name: Upload lists
        uses: actions/upload-artifact@v4
        with:
          name: iptv-m3u
          path: |
            m3u/
            manifest.json
            README.md
          if-no-files-found: error
      - name: Commit generated changes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- m3u manifest.json data/sources.json README.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update province and operator playlists"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
